  <style>
    /* Gallery-only page: removes the profile sidebar and gives the gallery the full page width. */
    body {
      background:
        radial-gradient(circle at 16% 12%, rgba(85, 167, 255, 0.20), transparent 30%),
        radial-gradient(circle at 90% 35%, rgba(14, 165, 164, 0.14), transparent 30%),
        linear-gradient(135deg, #f8fafc, #eaf1f8);
      color: #0f172a;
    }

    .site-header {
      background: rgba(248, 250, 252, 0.86);
      border-bottom: 1px solid rgba(15, 23, 42, 0.10);
    }

    .nav-links a {
      color: #334155;
    }

    .nav-links a:hover {
      color: #0f172a;
    }

    .gallery-hero .section-heading h2 {
      color: #0f172a;
    }

    .gallery-item {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.14);
    }
    
    .gallery-only-layout {
      width: min(1320px, calc(100% - 64px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    .gallery-panel {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
    }

    .gallery-hero {
      margin-bottom: 36px;
    }

    .gallery-hero .section-heading {
      justify-content: center;
      text-align: center;
      margin-bottom: 38px;
    }

    .gallery-hero .section-heading h2 {
      font-size: clamp(3.2rem, 6vw, 5.2rem);
      line-height: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px;
    }

    .gallery-item {
      position: relative;
      margin: 0;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(130, 181, 255, 0.24);
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.30);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.025);
    }

    .gallery-item figcaption {
      padding: 18px 24px;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(8, 36, 82, 0.96), rgba(26, 94, 178, 0.88));
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
    }

    .gallery-item figcaption ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .gallery-item figcaption li {
      margin: 0;
      font-size: clamp(0.95rem, 1.15vw, 1.08rem);
      line-height: 1.45;
      font-weight: 600;
    }

    .gallery-item figcaption strong {
      color: #dbeafe;
      font-weight: 800;
    }

    @media (max-width: 920px) {
      .gallery-only-layout {
        width: min(100% - 32px, 760px);
        padding: 52px 0 64px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 26px;
      }

      .gallery-item img {
        height: 340px;
      }
    }

    @media (max-width: 540px) {
      .gallery-only-layout {
        width: calc(100% - 24px);
      }

      .gallery-hero .section-heading {
        justify-content: flex-start;
        text-align: left;
      }

      .gallery-item img {
        height: 270px;
      }

      .gallery-item figcaption {
        position: relative;
        background: rgba(8, 36, 82, 0.98);
      }
    }
  </style>
</head>
